<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban Worm Ranching | Green Habits</title>

<style>
:root{
  --organic-white:#F7F0E7;
  --linen:#F1E3C3;
  --straw:#ECCA7A;
  --harvest:#DDB32A;
  --sage:#72843E;
  --tan:#E9D2B1;
  --white:#FFFFFF;
  --grey:#6C757D;
  --charcoal:#212529;
  --sage-dark:#56642F;
  --success:#49672F;
  --danger:#8B473D;
  --shadow:0 8px 22px rgba(33,37,41,.12);
  --radius:18px;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:#d8d8d4;
  color:var(--charcoal);
  font-family:Roboto,Arial,Helvetica,sans-serif;
}

button,select{font:inherit}
button{cursor:pointer}

button:focus-visible,
select:focus-visible{
  outline:4px solid var(--harvest);
  outline-offset:3px;
}

#app{
  width:min(100vw,1600px);
  min-height:100vh;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
}

.player{
  width:100%;
  aspect-ratio:16/9;
  max-height:calc(100vh - 32px);
  background:var(--organic-white);
  box-shadow:0 18px 50px rgba(0,0,0,.22);
  border-radius:22px;
  overflow:hidden;
  display:grid;
  grid-template-columns:230px 1fr;
  grid-template-rows:64px 1fr 62px;
}

.player-header{
  grid-column:1/-1;
  background:var(--organic-white);
  border-bottom:1px solid rgba(33,37,41,.12);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.brand-mark{
  width:38px;
  height:38px;
  border-radius:50% 50% 45% 55%;
  background:var(--sage);
  position:relative;
}

.brand-mark::after{
  content:"";
  width:12px;
  height:20px;
  border-radius:100% 0 100% 0;
  background:var(--straw);
  position:absolute;
  right:5px;
  top:5px;
  transform:rotate(18deg);
}

.brand-text strong{
  display:block;
  color:var(--sage-dark);
  font-weight:600;
}

.brand-text span{
  font-size:.78rem;
  color:var(--grey);
}

.header-progress{min-width:220px}

.header-progress-label{
  display:flex;
  justify-content:space-between;
  font-size:.72rem;
  color:var(--grey);
  margin-bottom:5px;
}

.progress-track{
  height:8px;
  background:#dedbd5;
  border-radius:999px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0;
  background:var(--sage);
  transition:width .3s ease;
}

/* MENU */

.sidebar{
  grid-column:1;
  grid-row:2;
  background:#f0eadf;
  border-right:1px solid rgba(33,37,41,.12);
  overflow-y:auto;
  padding:13px 10px 18px;
}

.menu-heading{
  margin:5px 8px 12px;
  color:var(--sage-dark);
  font-size:.76rem;
  text-transform:uppercase;
  letter-spacing:.08em;
  font-weight:700;
}

.menu-section{
  margin:12px 0 6px;
  padding:0 8px;
  font-size:.68rem;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--grey);
  font-weight:700;
}

.menu-item{
  width:100%;
  border:0;
  background:transparent;
  text-align:left;
  padding:8px 9px;
  margin:2px 0;
  border-radius:9px;
  display:grid;
  grid-template-columns:32px 1fr 18px;
  align-items:center;
  gap:5px;
  color:var(--charcoal);
  font-size:.75rem;
}

.menu-item:hover:not(:disabled){
  background:rgba(114,132,62,.12);
}

.menu-item.active{
  background:var(--white);
  box-shadow:0 2px 8px rgba(33,37,41,.08);
  color:var(--sage-dark);
  font-weight:600;
}

.menu-item.completed .menu-status{color:var(--sage)}

.menu-item:disabled{
  opacity:.43;
  cursor:not-allowed;
}

/* STAGE */

.stage{
  grid-column:2;
  grid-row:2;
  background:var(--linen);
  overflow:auto;
  padding:24px;
}

.slide{
  min-height:100%;
  max-width:1050px;
  margin:auto;
  background:var(--organic-white);
  border-radius:var(--radius);
  padding:30px 34px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}

.slide::before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  background:rgba(236,202,122,.30);
  right:-80px;
  top:-105px;
}

.slide.content{background:var(--linen)}

.slide.interaction{
  background:var(--organic-white);
  border-top:9px solid var(--straw);
}

.slide.assessment{background:var(--tan)}

.slide.completion{
  background:var(--organic-white);
  border:3px solid rgba(114,132,62,.35);
}

.eyebrow{
  color:var(--sage-dark);
  font-size:.72rem;
  text-transform:uppercase;
  letter-spacing:.1em;
  font-weight:700;
  margin-bottom:7px;
}

h1{
  position:relative;
  margin:0;
  max-width:82%;
  color:var(--sage-dark);
  font-size:clamp(1.7rem,3vw,2.7rem);
  font-weight:300;
  line-height:1.08;
}

.organic-rule{
  width:92px;
  height:5px;
  border-radius:100% 0 100% 0;
  background:var(--sage);
  margin:14px 0 20px;
  transform:skewX(-16deg);
}

.lead{
  font-size:clamp(.95rem,1.35vw,1.15rem);
  line-height:1.55;
  max-width:850px;
}

.small{
  font-size:.82rem;
  color:var(--grey);
}

.grid-2{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:15px;
  margin-top:18px;
}

.grid-3{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  margin-top:18px;
}

.card{
  background:var(--white);
  border:1px solid rgba(33,37,41,.11);
  border-radius:15px;
  padding:17px;
  box-shadow:0 3px 8px rgba(33,37,41,.08);
}

.card h3{
  margin:0 0 8px;
  color:var(--sage-dark);
}

.card p{
  margin:.3rem 0;
  line-height:1.45;
}

.icon-circle{
  width:45px;
  height:45px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--sage);
  color:white;
  font-weight:700;
  margin-bottom:11px;
}

.callout{
  margin-top:20px;
  padding:14px 17px;
  border-left:5px solid var(--sage);
  border-radius:8px;
  background:rgba(255,255,255,.65);
  line-height:1.45;
}

.media-placeholder{
  min-height:240px;
  border:2px dashed rgba(114,132,62,.65);
  border-radius:18px;
  background:rgba(255,255,255,.58);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:24px;
  margin:18px 0;
}

.media-icon{
  font-size:2.2rem;
  margin-bottom:9px;
}


/* INTEGRATED MEDIA */
.media-frame{
  margin:18px 0;
  border-radius:16px;
  overflow:hidden;
  background:#111;
  box-shadow:0 4px 12px rgba(33,37,41,.14);
}
.media-frame video{display:block;width:100%;height:auto;max-height:54vh;background:#111}
.asset-image{display:block;width:100%;height:auto;border-radius:14px}
.lillian-layout{display:grid;grid-template-columns:minmax(220px,.78fr) minmax(0,1.22fr);gap:22px;align-items:center;margin-top:10px}
.lillian-frame{min-height:0;margin:0;padding:0;overflow:hidden;border-style:solid;background:var(--white)}
.lillian-frame img{display:block;width:100%;height:390px;object-fit:cover;object-position:center 24%;}
.character-inline{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center;margin-top:18px}
.character-inline img{width:150px;height:190px;object-fit:cover;object-position:center 24%;border-radius:14px;background:white}
.asset-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.asset-link{display:inline-block;padding:8px 12px;border:1px solid rgba(86,100,47,.45);border-radius:8px;color:var(--sage-dark);background:white;text-decoration:none;font-size:.82rem;font-weight:600}
.asset-link:hover{text-decoration:underline}
.infographic-frame{background:white;padding:10px;border-radius:16px;margin-top:14px}
.infographic-frame img{display:block;width:100%;max-height:56vh;object-fit:contain}
.text-equivalent{margin-top:12px;background:white;border:1px solid rgba(33,37,41,.11);border-radius:12px;padding:0 14px}
.text-equivalent summary{cursor:pointer;padding:12px 0;font-weight:700;color:var(--sage-dark)}
.certificate-image{display:block;width:min(100%,760px);margin:16px auto;border-radius:10px;box-shadow:0 4px 12px rgba(33,37,41,.12)}
@media(max-width:900px){.lillian-layout{grid-template-columns:1fr}.lillian-frame img{height:330px}.character-inline{grid-template-columns:120px 1fr}.character-inline img{width:120px;height:160px}}

/* CHOICES */

.choices{
  display:grid;
  gap:10px;
  margin-top:17px;
}

.choice{
  border:2px solid rgba(114,132,62,.3);
  border-radius:13px;
  background:var(--white);
  padding:13px 15px;
  text-align:left;
  display:flex;
  gap:12px;
  align-items:flex-start;
  color:var(--charcoal);
}

.choice:hover{
  border-color:var(--sage);
}

.choice.selected{
  border-color:var(--harvest);
  background:#fff8dc;
}

.choice-letter{
  flex:0 0 28px;
  height:28px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--sage);
  color:white;
  font-weight:700;
}

.action-row{
  display:flex;
  gap:10px;
  margin-top:16px;
  flex-wrap:wrap;
}

.primary-btn{
  border:0;
  border-radius:10px;
  padding:11px 18px;
  font-weight:600;
  background:var(--harvest);
  color:var(--charcoal);
}

.primary-btn:hover{
  filter:brightness(.96);
}

.primary-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.feedback{
  margin-top:16px;
  border-radius:13px;
  padding:14px 16px;
  display:none;
  line-height:1.5;
}

.feedback.show{display:block}

.feedback.good{
  background:#e8efdf;
  border-left:5px solid var(--success);
}

.feedback.try{
  background:#fff5d6;
  border-left:5px solid var(--harvest);
}

.feedback.bad{
  background:#f5e4df;
  border-left:5px solid var(--danger);
}

/* TROUBLESHOOTING MATCH */

.symptom-row{
  display:grid;
  grid-template-columns:1.35fr 1fr;
  gap:12px;
  margin:11px 0;
  align-items:center;
}

.symptom-row select{
  width:100%;
  padding:10px;
  border:1px solid #aaa;
  border-radius:8px;
  background:white;
}

/* SEQUENCE */

.sequence-list{
  display:grid;
  gap:9px;
  margin-top:15px;
}

.sequence-item{
  background:white;
  border-radius:10px;
  padding:11px 12px;
  display:grid;
  grid-template-columns:60px 1fr;
  gap:10px;
  align-items:center;
}

.sequence-item select{
  padding:7px;
  border-radius:7px;
  border:1px solid #aaa;
}

/* PLAYER BAR */

.player-bar{
  grid-column:1/-1;
  grid-row:3;
  background:var(--charcoal);
  color:white;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  padding:0 18px;
  gap:14px;
}

.player-controls{
  display:flex;
  gap:8px;
}

.player-controls.right{
  justify-content:flex-end;
}

.player-btn{
  border:1px solid rgba(255,255,255,.32);
  background:transparent;
  color:white;
  border-radius:8px;
  padding:8px 15px;
}

.player-btn.continue{
  background:var(--harvest);
  border-color:var(--harvest);
  color:var(--charcoal);
  font-weight:700;
}

.player-btn:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.screen-count{
  text-align:center;
  font-size:.78rem;
  color:#ddd;
}

.certificate{
  max-width:620px;
  margin:18px auto;
  border:8px double var(--sage);
  background:white;
  padding:28px;
  text-align:center;
}

.certificate h2{
  color:var(--sage-dark);
  font-weight:300;
  font-size:2rem;
  margin:.3rem;
}

@media(max-width:900px){
  #app{padding:0}

  .player{
    min-height:100vh;
    aspect-ratio:auto;
    border-radius:0;
    grid-template-columns:170px 1fr;
  }

  .stage{padding:12px}
  .slide{padding:22px}
  .grid-2,.grid-3{grid-template-columns:1fr}
}

@media(max-width:650px){
  .player{
    grid-template-columns:1fr;
    grid-template-rows:60px auto 1fr 60px;
  }

  .player-header{grid-row:1}

  .sidebar{
    grid-column:1;
    grid-row:2;
    display:flex;
    overflow-x:auto;
    overflow-y:hidden;
    padding:6px;
    border-right:0;
    border-bottom:1px solid rgba(33,37,41,.12);
  }

  .menu-heading,.menu-section{display:none}

  .menu-item{
    min-width:145px;
    grid-template-columns:30px 1fr 15px;
  }

  .stage{
    grid-column:1;
    grid-row:3;
  }

  .player-bar{grid-row:4}
  .header-progress{min-width:120px}
  .brand-text span{display:none}

  .symptom-row{
    grid-template-columns:1fr;
  }
}
</style>
</head>

return slide.render();
}

}

if(type==="interaction"){
return "slide interaction";

return "slide assessment";

/* =========================================================
   DECISION INTERACTIONS
   ========================================================= */

function decisionHTML(eyebrow,title,prompt,stateKey,choices){

let selected=state[stateKey];

let html=choices.map(function(item){

let letter=item[0];
let text=item[1];

return `
<button
class="choice ${selected===letter ? "selected" : ""}"
data-letter="${letter}"
onclick="selectDecision('${stateKey}','${letter}',this)"
aria-pressed="${selected===letter ? "true" : "false"}">

<span class="choice-letter">${letter}</span>
<span>${text}</span>

</button>
`;

}).join("");

return `
<div class="eyebrow">${eyebrow}</div>
<h1>${title}</h1>
<div class="organic-rule"></div>

<p class="lead">${prompt}</p>

<div class="choices">
${html}
</div>

<div class="callout">
Choose the response that best fits the conditions you can observe.
Your choice will shape the feedback on the next screen.
</div>
`;

}

function selectDecision(stateKey,letter,button){

state[stateKey]=letter;

let group=button.parentElement;

let choices=group.querySelectorAll(".choice");

choices.forEach(function(choice){

let selected=choice.dataset.letter===letter;

choice.classList.toggle("selected",selected);

choice.setAttribute(
"aria-pressed",
selected ? "true" : "false"
);

});

refreshNavigation();

}

/* =========================================================
   QUIZ INTERACTIONS
   ========================================================= */

function quizHTML(key,eyebrow,title,prompt,choices){

let selected=state.quizSelections[key] || "";

let submitted=state.quizSubmitted[key] || false;

let data=quizData[key];

let choicesHTML=choices.map(function(item){

let letter=item[0];
let text=item[1];

return `
<button
class="choice ${selected===letter ? "selected" : ""}"
data-letter="${letter}"
onclick="selectQuiz('${key}','${letter}',this)"
aria-pressed="${selected===letter ? "true" : "false"}">

<span class="choice-letter">${letter}</span>
<span>${text}</span>

</button>
`;

}).join("");

let feedbackHTML=
'<div id="feedback-'+key+'" class="feedback" role="status"></div>';

if(submitted){

let correct=selected===data.correct;

feedbackHTML=`
<div
id="feedback-${key}"
class="feedback show ${correct ? "good" : "try"}"
role="status">

${correct ? data.good : data.bad}

</div>
`;

}

return `
<div class="eyebrow">${eyebrow}</div>
<h1>${title}</h1>
<div class="organic-rule"></div>

<p class="lead">${prompt}</p>

<div class="choices">
${choicesHTML}
</div>

<div class="action-row">

<button
class="primary-btn"
id="submit-${key}"
onclick="submitQuiz('${key}')">

${submitted ? "Response Submitted" : "Submit"}

</button>

</div>

${feedbackHTML}
`;

}

function selectQuiz(key,letter,button){

/*
Once submitted, keep the reviewed response stable.
*/

if(state.quizSubmitted[key]){
return;
}

state.quizSelections[key]=letter;

let choices=
button.parentElement.querySelectorAll(".choice");

choices.forEach(function(choice){

let selected=
choice.dataset.letter===letter;

choice.classList.toggle(
"selected",
selected
);

choice.setAttribute(
"aria-pressed",
selected ? "true" : "false"
);

});

}



function submitQuiz(key){

let selected=state.quizSelections[key];

let feedback=
document.getElementById("feedback-"+key);

if(!selected){

feedback.className="feedback show try";

feedback.textContent=
"Choose an answer before submitting.";

return;

}

let data=quizData[key];

let correct=
selected===data.correct;

state.quizSubmitted[key]=true;

/* Formative completion */

if(key==="kc1"){
state.kc1Complete=true;
}

if(key==="kc2"){
state.kc2Complete=true;
}

/* Summative response recording */

if(
key==="a1" ||
key==="a2" ||
key==="a4"
){

state.assessment[key]=correct;

}

/* Show feedback */

feedback.className=
"feedback show "+
(correct ? "good" : "try");

feedback.innerHTML=
(correct ? data.good : data.bad);

/*
For formative multiple-choice checks only,
offer an optional retry after an incorrect response.
*/

if(
(key==="kc1" || key==="kc2") &&
!correct
){

feedback.innerHTML +=
'<div class="action-row">'+
'<button class="primary-btn" onclick="retryQuiz(\''+key+'\')">'+
'Try Again'+
'</button>'+
'</div>';

}

/*
Freeze the submitted response until the learner
either retries or continues.
*/

let submitButton=
document.getElementById("submit-"+key);

if(submitButton){

submitButton.textContent=
"Response Submitted";

submitButton.disabled=true;

}

let choiceButtons=
feedback.parentElement.querySelectorAll(".choice");

choiceButtons.forEach(function(button){
button.disabled=true;
});

/*
Submission completes the formative check even when
the response is incorrect, so Continue remains an option.
*/

refreshNavigation();

}
function retryQuiz(key){

/*
Clear only this attempt.
The learner remains on the same formative screen.
*/

state.quizSelections[key]="";
state.quizSubmitted[key]=false;

/*
The knowledge check remains incomplete while the learner
is actively retrying it.
*/

if(key==="kc1"){
state.kc1Complete=false;
}

if(key==="kc2"){
state.kc2Complete=false;
}

/*
Re-render the screen in its unanswered state.
*/

render();

}

function checkSymptoms(){

let s1=
document.getElementById("s1").value;

let s2=
document.getElementById("s2").value;

let s3=
document.getElementById("s3").value;

let feedback=
document.getElementById("symptomFeedback");

if(!s1 || !s2 || !s3){

feedback.className=
"feedback show try";

feedback.textContent=
"Choose a response for all three conditions before submitting.";

return;

}

let correct=
s1==="dry" &&
s2==="water" &&
s3==="steady";

feedback.className=
"feedback show "+
(correct ? "good" : "try");

if(correct){

feedback.textContent=
"Good reasoning. You matched each response to the evidence: reduce input and excess moisture when conditions are soggy, restore moisture cautiously when bedding is too dry, and avoid unnecessary changes when the system is functioning steadily.";

}else{

feedback.textContent=
"Review the observations rather than looking for a single rule. Soggy bedding with uneaten food calls for less input and drier material. Dry, crumbly bedding may need cautious moisture. A bin that is processing food steadily without odor may not need correction at all.";

}

/*
This is formative.
Submission and review complete the branch,
even when the first response is not fully correct.
*/

state.kc3Complete=true;

let selects=
document.querySelectorAll(
"#s1,#s2,#s3"
);

selects.forEach(function(select){
select.disabled=true;
});

let submit=
feedback.parentElement.querySelector(
".primary-btn"
);

if(submit){

submit.disabled=true;
submit.textContent=
"Responses Submitted";

}

refreshNavigation();

}

function sequenceItem(id,text){

return `
<div class="sequence-item">

<select
id="${id}"
aria-label="Sequence position for ${text}">

<option value="">#</option>
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>

</select>

<span>${text}</span>

</div>
`;

}

function checkSequence(){

let worms=
document.getElementById("seqWorms").value;

let observe=
document.getElementById("seqObserve").value;

let container=
document.getElementById("seqContainer").value;

let food=
document.getElementById("seqFood").value;

let bedding=
document.getElementById("seqBedding").value;

let values=[
worms,
observe,
container,
food,
bedding
];

let feedback=
document.getElementById(
"sequenceFeedback"
);

if(values.some(function(value){
return value==="";
})){

feedback.className=
"feedback show try";

feedback.textContent=
"Assign a position to every action before submitting.";

return;

}

let unique=
new Set(values);

if(unique.size!==5){

feedback.className=
"feedback show try";

feedback.textContent=
"Use each position from 1 through 5 exactly once.";

return;

}

/*
Correct conceptual sequence:

1 Container / airflow
2 Bedding / moisture
3 Worms
4 Modest feeding
5 Observe
*/

let correct=
container==="1" &&
bedding==="2" &&
worms==="3" &&
food==="4" &&
observe==="5";

state.sequenceSubmitted=true;

state.assessment.a3=correct;

feedback.className=
"feedback show "+
(correct ? "good" : "try");

if(correct){

feedback.textContent=
"Good. You established the physical environment before introducing the worms, began feeding modestly, and left observation as the final step before making additional changes.";

}else{

feedback.textContent=
"Think about what each later action depends on. Establish the container and bedding environment first. Then introduce the worms, begin modest feeding, and observe the system before making further adjustments.";

}

let selects=
document.querySelectorAll(
"#seqWorms,#seqObserve,#seqContainer,#seqFood,#seqBedding"
);

selects.forEach(function(select){
select.disabled=true;
});

let submit=
feedback.parentElement.querySelector(
".primary-btn"
);

if(submit){

submit.disabled=true;
submit.textContent=
"Sequence Submitted";

}

refreshNavigation();

}

/* =========================================================
   PROGRESSION
   ========================================================= */

function slideUnlocked(index){

/* Shared preparation + first branch decision */

if(index<=8){
return true;
}

/* B1 consequence + KC require B1 decision */

if(index===9 || index===10){
return state.b1Choice!=="";
}

/* B2 decision requires B1 KC */

if(index===11){
return state.kc1Complete;
}

/* B2 consequence + KC require B2 decision */

if(index===12 || index===13){

return (
state.kc1Complete &&
state.b2Choice!==""
);

}

/* B3 decision requires B2 KC */

if(index===14){
return state.kc2Complete;
}

/* B3 consequence + KC require B3 decision */

if(index===15 || index===16){

return (
state.kc2Complete &&
state.b3Choice!==""
);

}

/* Debrief onward requires all branches */

if(index>=17){
return state.kc3Complete;
}

return true;

}

function currentScreenComplete(){

let index=state.current;

/* Decisions */

if(index===8){
return state.b1Choice!=="";
}

if(index===11){
return state.b2Choice!=="";
}

if(index===14){
return state.b3Choice!=="";
}

/* Formative knowledge checks */

if(index===10){
return state.kc1Complete;
}

if(index===13){
return state.kc2Complete;
}

if(index===16){
return state.kc3Complete;
}

/* Summative MCQ */

if(index===19){
return !!state.quizSubmitted.a1;
}

if(index===20){
return !!state.quizSubmitted.a2;
}

/* Sequencing */

if(index===21){
return state.sequenceSubmitted;
}

/* Final summative MCQ */

if(index===22){
return !!state.quizSubmitted.a4;
}

return true;

}

/* =========================================================
   MENU
   ========================================================= */

function updateMenu(){

let menu=
document.getElementById("menu");

let html=
'<div class="menu-heading">Module Menu</div>';

let lastSection="";

slides.forEach(function(slide,index){

if(slide.section!==lastSection){

html+=
'<div class="menu-section">'+
slide.section+
'</div>';

lastSection=
slide.section;

}

let locked=
!slideUnlocked(index);

let active=
index===state.current;

let completed=
state.visited.has(index) &&
index!==state.current;

html+=`
<button
class="menu-item
${active ? "active" : ""}
${completed ? "completed" : ""}"

${locked ? "disabled" : ""}

onclick="goTo(${index})"

aria-current="${active ? "page" : "false"}">

<span>${slide.id}</span>

<span>${slide.title}</span>

<span class="menu-status">
${locked ? "🔒" : completed ? "✓" : active ? "•" : ""}
</span>

</button>
`;

});

menu.innerHTML=html;

}

/* =========================================================
   NAVIGATION
   ========================================================= */

function goTo(index){

if(
index<0 ||
index>=slides.length
){
return;
}

if(!slideUnlocked(index)){
return;
}

state.current=index;

state.visited.add(index);

render();

}

function next(){

if(!currentScreenComplete()){
return;
}

let nextIndex=
state.current+1;

if(nextIndex>=slides.length){
return;
}

if(!slideUnlocked(nextIndex)){
return;
}

goTo(nextIndex);

}

function back(){

if(state.current>0){
goTo(state.current-1);
}

}

/* =========================================================
   PROGRESS
   ========================================================= */

function updateProgress(){

let completed=0;

slides.forEach(function(slide,index){

if(
state.visited.has(index) &&
index<state.current
){

completed++;

}

});

let percent=
Math.round(
(completed/slides.length)*100
);

document
.getElementById("progressFill")
.style.width=
percent+"%";

document
.getElementById("progressText")
.textContent=
percent+"%";

}

/* =========================================================
   PLAYER CONTROL STATE
   ========================================================= */

function refreshNavigation(){

updateMenu();
updateProgress();

let backButton=
document.getElementById(
"backBtn"
);

let continueButton=
document.getElementById(
"continueBtn"
);

backButton.disabled=
state.current===0;

if(
state.current===
slides.length-1
){

continueButton.disabled=true;

continueButton.textContent=
"Complete";

return;

}

let ready=
currentScreenComplete();

let nextAvailable=
slideUnlocked(
state.current+1
);

continueButton.disabled=
!(ready && nextAvailable);

continueButton.textContent=
continueButton.disabled
?
"Complete screen to continue"
:
"Continue →";

}

/* =========================================================
   RENDER
   ========================================================= */

function render(){

let slide=
slides[state.current];

let stage=
document.getElementById("stage");

stage.innerHTML=
'<article class="'+
slideClass(slide.type)+
'">'+
getSlideHTML(slide)+
'</article>';

stage.scrollTop=0;

document
.getElementById("screenCount")
.textContent=
"Screen "+
(state.current+1)+
" of "+
slides.length;

refreshNavigation();

let heading=
stage.querySelector("h1");

if(heading){

heading.setAttribute(
"tabindex",
"-1"
);

try{

heading.focus({
preventScroll:true
});

}catch(error){

heading.focus();

}

}

}

/* =========================================================
   EVENTS
   ========================================================= */

document
.getElementById("backBtn")
.addEventListener(
"click",
back
);

document
.getElementById("continueBtn")
.addEventListener(
"click",
next
);

document.addEventListener(
"keydown",
function(event){

if(
event.altKey &&
event.key==="ArrowLeft"
){

event.preventDefault();
back();

}

if(
event.altKey &&
event.key==="ArrowRight"
){

event.preventDefault();
next();

}

}
);

/* =========================================================
   INITIALIZE
   ========================================================= */

render();

</script>

</body>
</html>
